<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poker Texas Hold'em</title>
  <meta name="theme-color" content="#0b1410">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- LOBBY -->
<section id="lobby">
  <div class="lobby-card">
    <div class="brand">
      <div class="suits"><span>♠</span><span class="red">♥</span><span>♣</span><span class="red">♦</span></div>
      <h1>Texas Hold'em</h1>
      <p>Poker online · até 8 jogadores</p>
    </div>
    <form id="joinForm" autocomplete="off">
      <label>Seu nome
        <input id="nameInput" maxlength="16" placeholder="Ex.: Raul" required>
      </label>
      <label>Sala
        <input id="roomInput" maxlength="24" placeholder="principal">
      </label>
      <details id="opts">
        <summary>Configurar nova sala</summary>
        <div class="opt-grid">
          <label>Small blind <input id="sbInput" type="number" min="1" value="10"></label>
          <label>Big blind <input id="bbInput" type="number" min="2" value="20"></label>
          <label>Fichas iniciais <input id="stackInput" type="number" min="100" value="2000"></label>
          <label>Tempo por jogada (s) <input id="timeInput" type="number" min="10" max="120" value="25"></label>
        </div>
        <small>As configurações valem apenas quando a sala ainda não existe.</small>
      </details>
      <button class="btn gold big" type="submit">Entrar na mesa</button>
    </form>
    <div class="rooms">
      <h3>Salas abertas</h3>
      <ul id="roomList"><li class="muted">Nenhuma sala aberta. Crie a sua!</li></ul>
    </div>
  </div>
</section>

<!-- JOGO -->
<section id="game" hidden>
  <header class="topbar">
    <div class="room-info">
      <strong id="roomName">principal</strong>
      <span id="blindsInfo" class="muted"></span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="copyBtn" title="Copiar convite">🔗<span>Convidar</span></button>
      <button class="icon-btn" id="soundBtn" title="Som">🔊</button>
      <button class="icon-btn" id="sideBtn" title="Chat e histórico">💬<span class="badge" id="chatBadge" hidden></span></button>
      <button class="icon-btn" id="leaveBtn" title="Sair">🚪<span>Sair</span></button>
    </div>
  </header>

  <main id="stage">
    <div id="tableWrap">
      <div id="table">
        <div class="rail">
          <div class="felt">
            <div class="felt-logo">♠ TEXAS HOLD'EM ♥</div>
            <div id="deck" class="deck"><div class="card back"></div><div class="card back"></div><div class="card back"></div></div>
            <div id="pot" class="pot"><div class="chips"></div><div class="pot-amt"></div></div>
            <div id="board" class="board"></div>
            <div id="status" class="status"></div>
          </div>
        </div>
        <div id="seats"></div>
        <div id="dealerBtn" class="dealer-btn" hidden>D</div>
        <div id="banner" class="banner" hidden></div>
      </div>
    </div>
  </main>

  <footer id="controls">
    <div id="myInfo" class="my-info"></div>
    <div id="actions" class="actions" hidden>
      <div class="raise-box" id="raiseBox">
        <div class="presets">
          <button data-p="min">Mín</button>
          <button data-p="half">½ Pote</button>
          <button data-p="pot">Pote</button>
          <button data-p="max">All-in</button>
        </div>
        <div class="slider-row">
          <button class="step" data-s="-1">−</button>
          <input type="range" id="raiseRange">
          <button class="step" data-s="1">+</button>
          <input type="number" id="raiseInput">
        </div>
      </div>
      <div class="main-btns">
        <button class="btn red" id="foldBtn">Fold <kbd>F</kbd></button>
        <button class="btn blue" id="callBtn">Check <kbd>C</kbd></button>
        <button class="btn gold" id="raiseBtn">Aumentar <kbd>R</kbd></button>
      </div>
    </div>
    <div id="extra" class="extra">
      <button class="btn small" id="rebuyBtn" hidden>Recomprar fichas</button>
      <button class="btn small ghost" id="sitoutBtn" hidden>Ausentar</button>
    </div>
  </footer>

  <aside id="side" class="side">
    <div class="side-head">
      <div class="tabs"><button class="tab active" data-tab="chat">Chat</button><button class="tab" data-tab="log">Histórico</button></div>
      <button class="icon-btn" id="closeSide">✕</button>
    </div>
    <ul id="chatList" class="list"></ul>
    <ul id="logList" class="list" hidden></ul>
    <form id="chatForm"><input id="chatInput" maxlength="200" placeholder="Mensagem..."><button class="btn small gold">Enviar</button></form>
  </aside>
</section>

<div id="toast" class="toast" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/sound.js"></script>
<script src="js/app.js"></script>
</body>
</html>
